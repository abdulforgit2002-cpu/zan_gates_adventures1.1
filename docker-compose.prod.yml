services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - zangates

  backend:
    image: ghcr.io/abdulforgit2002-cpu/zan-gates-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      PORT: "8080"
      # SEO: canonical/sitemap host, where to read the built index.html and
      # seo-data.json (the frontend container, over the compose network), and
      # extra PHP workers so page renders never queue behind API calls.
      SITE_URL: ${SITE_URL:-https://zanzibargates.co.tz}
      FRONTEND_INTERNAL_URL: http://frontend
      PHP_CLI_SERVER_WORKERS: "4"
    ports:
      - "8028:8080"
    networks:
      - zangates

  frontend:
    image: ghcr.io/abdulforgit2002-cpu/zan-gates-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3016:80"
    networks:
      - zangates

volumes:
  postgres_data:

networks:
  zangates:
    driver: bridge
