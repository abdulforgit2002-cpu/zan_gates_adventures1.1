    <!-- =====================================================
         GTRANSLATE WEBSITE TRANSLATOR
         -----------------------------------------------------
         Source language:
         English

         Available languages:
         English
         Deutsch
         Italiano
         Français
         Polski
         ===================================================== -->

    <script>
      window.gtranslateSettings = {
        default_language: "en",
        native_language_names: true,

        /*
         * We deliberately disable automatic browser-language
         * detection so the visitor remains in the language
         * selected from the ZAN GATES language selector.
         */
        detect_browser_language: false,

        /*
         * GTranslate will render its actual translation
         * engine inside this hidden wrapper.
         *
         * The visible selector is our custom React component.
         */
        wrapper_selector: ".gtranslate_wrapper",

        /*
         * Five languages only.
         */
        languages: [
          "en",
          "de",
          "it",
          "fr",
          "pl"
        ],

        /*
         * English should use the United States flag,
         * matching the current visual design.
         */
        alt_flags: {
          en: "usa"
        },

        flag_size: 24,

        /*
         * The actual GTranslate widget remains hidden from
         * the visitor because ZAN GATES uses its own
         * professionally designed language selector.
         */
        horizontal_position: "right",
        vertical_position: "bottom",
        switcher_vertical_position: "bottom",
        switcher_horizontal_position: "right",
        switcher_open_direction: "top"
      };
    </script>

    <!-- =====================================================
         GTRANSLATE WIDGET LOADER
         ===================================================== -->
    <script
      src="https://cdn.gtranslate.net/widgets/latest/dropdown.js"
      defer
    ></script>

    <div

      id="gtranslate-engine"
      aria-hidden="true"
    ></div>
