<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- =====================================================
         WEBSITE FAVICON
         ===================================================== -->
    <link
      rel="icon"
      type="image/jpeg"
      href="https://res.cloudinary.com/djczmay2i/image/upload/c_fill,w_128,h_128,r_max/v1788254388/ZAN_GATES_ADVENTURES_k59crf.jpg"
      sizes="128x128"
    />

    <!-- =====================================================
         RESPONSIVE DESIGN
         ===================================================== -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- =====================================================
         SEO DESCRIPTION
         ===================================================== -->
    <meta
      name="description"
      content="ZAN GATES ADVENTURES — Discover unforgettable tours, experiences and destinations across Zanzibar."
    />

    <!-- =====================================================
         WEBSITE TITLE
         ===================================================== -->
    <title>ZAN GATES Adventures Tours & Safaris</title>

    <!-- =====================================================
         GTRANSLATE WEBSITE TRANSLATOR
         -----------------------------------------------------
         Source language:
         English

         Available languages:
         English
         Deutsch
         Italiano
         Français
         Polski
         ===================================================== -->

    <script>
      window.gtranslateSettings = {
        default_language: "en",
        native_language_names: true,

        /*
         * We deliberately disable automatic browser-language
         * detection so the visitor remains in the language
         * selected from the ZAN GATES language selector.
         */
        detect_browser_language: false,

        /*
         * GTranslate will render its actual translation
         * engine inside this hidden wrapper.
         *
         * The visible selector is our custom React component.
         */
        wrapper_selector: ".gtranslate_wrapper",

        /*
         * Five languages only.
         */
        languages: [
          "en",
          "de",
          "it",
          "fr",
          "pl"
        ],

        /*
         * English should use the United States flag,
         * matching the current visual design.
         */
        alt_flags: {
          en: "usa"
        },

        flag_size: 24,

        /*
         * The actual GTranslate widget remains hidden from
         * the visitor because ZAN GATES uses its own
         * professionally designed language selector.
         */
        horizontal_position: "right",
        vertical_position: "bottom",
        switcher_vertical_position: "bottom",
        switcher_horizontal_position: "right",
        switcher_open_direction: "top"
      };
    </script>

    <!-- =====================================================
         GTRANSLATE WIDGET LOADER
         ===================================================== -->
    <script
      src="https://cdn.gtranslate.net/widgets/latest/dropdown.js"
      defer
    ></script>
  </head>

  <body>
    <!-- =====================================================
         GTRANSLATE ENGINE
         -----------------------------------------------------
         The React LanguageSwitcher controls this widget.
         It is intentionally visually hidden by CSS.
         ===================================================== -->
    <div
      class="gtranslate_wrapper"
      id="gtranslate-engine"
      aria-hidden="true"
    ></div>

    <!-- =====================================================
         REACT APPLICATION
         ===================================================== -->
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
