# Cache for server-rendered pages and sitemaps (the backend's /seo/render and
# /sitemap*.xml). Lives in the container, so every frontend deploy starts with
# an empty cache — the cached HTML can never reference a previous build's assets.
proxy_cache_path /var/cache/nginx/seo levels=1:2 keys_zone=seo_pages:10m max_size=64m inactive=30m use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Using a variable for the upstream makes nginx
    # re-resolve `backend` at request time, so the site keeps working when the
    # backend container is recreated with a new IP (and nginx can start even if
    # the backend is not up yet).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # ------------------------------------------------------------------
    # Static assets — Vite's built files are content-hashed, so they are
    # safe to cache hard. A missing asset is a real 404, never index.html.
    # ------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Read by the backend renderer over the internal network; not for search.
    location = /seo-data.json {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ------------------------------------------------------------------
    # Sitemaps — generated from the database by the backend.
    # ------------------------------------------------------------------
    location ~ ^/(sitemap(?:-[a-z]+)?\.xml)$ {
        proxy_pass $backend/$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;

        proxy_cache seo_pages;
        proxy_cache_key "$scheme$host$uri";
        proxy_cache_valid 200 10m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;

        add_header X-Cache-Status $upstream_cache_status always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # ------------------------------------------------------------------
    # Pages — every URL that is not a real file is a client-side route.
    # The backend returns index.html with that route's <title>, meta tags,
    # JSON-LD, crawler-visible content and the correct HTTP status (404 for
    # unknown tours/pages). If the backend is slow, down or errors, the plain
    # static index.html is served instead: the site never depends on it.
    # ------------------------------------------------------------------
    location = / {
        try_files /__no_such_file__ @seo;
    }

    location / {
        try_files $uri @seo;
    }

    location @seo {
        proxy_pass $backend/seo/render;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 2s;
        proxy_read_timeout 6s;

        proxy_cache seo_pages;
        proxy_cache_key "$scheme$host$uri";
        proxy_cache_valid 200 5m;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_hide_header Cache-Control;

        proxy_intercept_errors on;
        error_page 500 502 503 504 = @shell;

        add_header Cache-Control "no-cache" always;
        add_header X-Cache-Status $upstream_cache_status always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location @shell {
        rewrite ^ /index.html break;

        add_header Cache-Control "no-cache" always;
        add_header X-Seo-Fallback "1" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
